<header class="flex justify-between items-center h-16 px-container-padding bg-background border-b border-outline-variant sticky top-0 z-30 shrink-0">
    <div class="flex items-center gap-4">
        <a href="{% if request.user.is_authenticated %}{% url 'dashboard:dashboard' %}{% else %}/{% endif %}" class="md:hidden font-display text-headline-lg text-primary">
            LeetLog
        </a>
        {% if request.user.is_authenticated %}
        <form method="get" action="{% url 'dashboard:search' %}" class="hidden sm:block">
            <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
                <input name="q"
                       value="{{ request.GET.q|default:'' }}"
                       class="pl-10 pr-4 py-2 hud-card rounded-lg font-label-mono text-label-mono text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/50 w-64 transition-all"
                       placeholder="Search problems, notes..." type="text"/>
            </div>
        </form>
        {% endif %}
    </div>
    <div class="flex items-center gap-2">
        {% if request.user.is_authenticated %}
            <span class="hidden sm:block text-sm text-on-surface-variant font-body-md">Hi, {{ request.user.first_name }}</span>
            <button class="p-2 text-on-surface-variant hover:text-primary hover:bg-surface-variant rounded-lg transition-colors">
                <span class="material-symbols-outlined">notifications</span>
            </button>
            <div class="w-8 h-8 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center ml-2">
                <span class="font-label-mono text-label-mono text-primary">{{ request.user.first_name.0 }}</span>
            </div>
        {% endif %}
    </div>
</header>
